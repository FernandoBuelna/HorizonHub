<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HorizonHub — Mi Perfil</title>
    <link rel="stylesheet" href="estilos/perfil.css">
</head>
<body>

    <!-- barra de navegacion -->
    <nav>
        <a href="pagina-inicio.html" class="nav-logo">Horizon<span>Hub</span></a>
        <div class="nav-enlaces">
            <a href="pagina-inicio.html">Inicio</a>
            <a href="proyectos.html">Proyectos</a>
            <a href="estudiantes.html">Estudiantes</a>
        </div>
        <div class="nav-botones" id="nav-botones"></div>
    </nav>

    <!-- secciones del perfil -->
    <div class="perfil-layout">

        <!-- sidebar -->
        <aside class="perfil-sidebar">

            <!-- avatar -->
            <div class="perfil-avatar" id="perfil-avatar"></div>

            <!-- datos -->
            <div class="perfil-nombre" id="perfil-nombre"></div>
            <div class="perfil-dato" id="perfil-carrera"></div>
            <div class="perfil-dato" id="perfil-semestre"></div>
            <div class="perfil-descripcion oculto" id="perfil-descripcion"></div>
            <a class="perfil-dato oculto" id="perfil-github" target="_blank"></a>
            <a class="perfil-dato oculto" id="perfil-linkedin" target="_blank"></a>
            <div class="perfil-dato" id="perfil-telefono"></div>

            <!-- botones -->
            <div class="perfil-acciones">
                <button type="button" class="boton-editar" onclick="abrirEditarPerfil()">Editar perfil</button>
                <a class="boton-cv oculto" id="btn-cv" target="_blank">Ver CV</a>            
            </div>

            <!-- separador -->
            <div class="sidebar-separador"></div>

            <!-- navegacion -->
            <button class="sidebar-item activo" data-seccion="proyectos">Proyectos</button>
            <button class="sidebar-item" data-seccion="habilidades">Habilidades</button>
            <button class="sidebar-item" data-seccion="experiencias">Experiencia</button>

        </aside>

        <!-- contenido principal -->
        <main class="perfil-contenido">

            <!-- seccion proyectos -->
            <div class="seccion" id="seccion-proyectos">
                <div class="seccion-header">
                    <h2>Mis proyectos</h2>
                    <button type="button" class="boton-agregar" id="btn-nuevo-proyecto" onclick="agregarProyecto()">+ Nuevo</button>
                </div>
                <div id="lista-proyectos"></div>
            </div>

            <!-- seccion habilidades -->
            <div class="seccion oculto" id="seccion-habilidades">
                <div class="seccion-header">
                    <h2>Mis habilidades</h2>
                    <button type="button" class="boton-agregar" id="btn-nueva-habilidad" onclick="agregarHabilidad()">+ Agregar</button>
                </div>
                <div id="lista-habilidades"></div>
            </div>

            <!-- seccion experiencias -->
            <div class="seccion oculto" id="seccion-experiencias">
                <div class="seccion-header">
                    <h2>Mi experiencia</h2>
                    <button type="button" class="boton-agregar" id="btn-nueva-experiencia" onclick="agregarExperiencia()">+ Agregar</button>
                </div>
                <div id="lista-experiencias"></div>
            </div>

        </main>
    </div>

    <!-- modal editar perfil -->
    <div class="modal-fondo oculto" id="modal-editar-perfil">
        <div class="modal">
            <div class="modal-header">
                <h3>Editar perfil</h3>
                <button type="button" class="modal-cerrar" onclick="cerrarModalEditarPerfil()">✕</button>
            </div>
            <div class="modal-cuerpo">
                <div class="campo">
                    <label for="editar-nombre">Nombre completo</label>
                    <input type="text" id="editar-nombre" placeholder="Tu nombre">
                </div>
                <div class="campo">
                    <label for="editar-carrera">Carrera</label>
                    <input type="text" id="editar-carrera" placeholder="Ing. en Sistemas">
                </div>
                <div class="campo">
                    <label for="editar-semestre">Semestre</label>
                    <input type="number" id="editar-semestre" placeholder="4" min="1" max="12">
                </div>
                <div class="campo">
                    <label for="editar-descripcion">Descripcion</label>
                    <textarea id="editar-descripcion" placeholder="Cuentanos sobre ti... (Maximo 150 caracteres)" maxlength="150"></textarea>
                </div>
                <div class="campo">
                    <label for="editar-github">GitHub</label>
                    <input type="text" id="editar-github" placeholder="https://github.com/usuario">
                </div>
                <div class="campo">
                    <label for="editar-linkedin">LinkedIn</label>
                    <input type="text" id="editar-linkedin" placeholder="https://linkedin.com/in/usuario">
                </div>
                <div class="campo">
                    <label for="editar-telefono">Telefono</label>
                    <input type="text" id="editar-telefono" placeholder="6441234567">
                </div>
                    <div class="campo">
                        <label for="editar-cv">CV</label>
                        <input type="url" id="editar-cv" placeholder="https://drive.google.com/tu-cv.pdf">
                    </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="boton-cancelar" onclick="cerrarModalEditarPerfil()">Cancelar</button>
                <button type="button" class="boton-guardar" onclick="guardarEditarPerfil()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- modal nuevo proyecto -->
    <div class="modal-fondo oculto" id="modal-proyecto">
        <div class="modal">
            <div class="modal-header">
                <h3>Nuevo proyecto</h3>
                <button type="button" class="modal-cerrar" id="cerrar-modal-proyecto" onclick="cerrarModal()">✕</button>
            </div>
            <div class="modal-cuerpo">
                <div class="campo">
                    <label for="proyecto-nombre">Nombre del proyecto</label>
                    <input type="text" id="proyecto-nombre" placeholder="Mi proyecto">
                </div>
                <div class="campo">
                    <label for="proyecto-descripcion">Descripcion</label>
                    <textarea id="proyecto-descripcion" placeholder="Describe tu proyecto..."></textarea>
                </div>
                <div class="campo">
                    <label for="proyecto-repositorio">URL del repositorio</label>
                    <input type="text" id="proyecto-repositorio" placeholder="https://github.com/...">
                </div>
                <div class="campo">
                    <label>Tecnologias</label>
                    <select id="proyecto-tecnologias">
                        <option value="">Selecciona una tecnologia...</option>
                    </select>
                    <div class="tags-seleccionados" id="tags-tecnologias"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="boton-cancelar" id="cancelar-proyecto" onclick="cerrarModal()">Cancelar</button>
                <button type="button" class="boton-guardar" id="guardar-proyecto" onclick="guardarProyecto()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- modal nueva habilidad -->
    <div class="modal-fondo oculto" id="modal-habilidad">
        <div class="modal">
            <div class="modal-header">
                <h3>Nueva habilidad</h3>
                <button type="button" class="modal-cerrar" onclick="cerrarModalHabilidad()">✕</button>
            </div>
            <div class="modal-cuerpo">
                <div class="campo">
                    <select id="habilidad-nombre">
                        <option value="">Selecciona una habilidad...</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="habilidad-nivel">Nivel</label>
                    <select id="habilidad-nivel">
                        <option value="">Selecciona un nivel...</option>
                        <option value="basico">Basico</option>
                        <option value="intermedio">Intermedio</option>
                        <option value="avanzado">Avanzado</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="boton-cancelar" onclick="cerrarModalHabilidad()">Cancelar</button>
                <button type="button" class="boton-guardar" onclick="guardarHabilidad()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- modal experiencia -->
    <div class="modal-fondo oculto" id="modal-experiencia">
        <div class="modal">
            <div class="modal-header">
                <h3>Nueva experiencia</h3>
                <button type="button" class="modal-cerrar" onclick="cerrarModalExperiencia()">✕</button>
            </div>
            <div class="modal-cuerpo">
                <div class="campo">
                    <label for="experiencia-nombre">Titulo</label>
                    <input type="text" id="experiencia-nombre" placeholder="Curso de React...">
                </div>
                <div class="campo">
                    <label for="experiencia-institucion">Institucion</label>
                    <input type="text" id="experiencia-institucion" placeholder="Udemy, Coursera...">
                </div>
                <div class="campo">
                    <label for="experiencia-tipo">Tipo</label>
                    <select id="experiencia-tipo">
                        <option value="">Selecciona un tipo...</option>
                        <option value="carrera">Carrera</option>
                        <option value="curso">Curso</option>
                        <option value="hackathon">Hackathon</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="experiencia-inicio">Fecha de inicio</label>
                    <input type="date" id="experiencia-inicio">
                </div>
                <div class="campo">
                    <label for="experiencia-fin">Fecha de fin</label>
                    <input type="date" id="experiencia-fin">
                </div>
                <div class="campo">
                    <label for="experiencia-descripcion">Descripcion</label>
                    <textarea id="experiencia-descripcion" placeholder="Describe tu experiencia..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="boton-cancelar" onclick="cerrarModalExperiencia()">Cancelar</button>
                <button type="button" class="boton-guardar" onclick="guardarExperiencia()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- footer -->
    <footer>
        <span>HorizonHub © 2026</span>
    </footer>

    <script src="scripts/perfil.js"></script>
    <script src="scripts/proyectos.js"></script>
    <script src="scripts/habilidades.js"></script>
    <script src="scripts/experiencias.js"></script>
    <script src="scripts/navbar.js"></script>
</body>
</html>
